name: TestFlight

# Builds a signed release and uploads it to App Store Connect, where it
# appears in TestFlight once Apple finishes processing (usually 10 to 30
# minutes). Run it from the Actions tab ("Run workflow"), or push a tag
# such as v1.0.0. docs/release.md lists the one-time setup.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the signing secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/release.md."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # Every upload needs a new build number; the run number always grows.
      - name: Build the Flutter app
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Archive with automatic signing
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
